services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegis_mos
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis_mos"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://aegis:aegis_dev@postgres:5432/aegis_mos"
      HMAC_SECRET_KEY: "dev-secret-key-change-in-production"
    volumes:
      - ./backend:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    environment:
      VITE_WS_URL: "ws://localhost:8000/ws/telemetry"
      VITE_API_URL: "http://localhost:8000"

volumes:
  pgdata:
